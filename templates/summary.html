<!DOCTYPE html>
<html>
    <head>
        <title>
            TigerMunch Summary
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/summarystyle.css') }}">
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">
    </head>
    <body>
        {% include 'header.html' %}
        <main>
            <div class="m-5 p-5 center-content-pg">
                <h1>Past Meals</h1>
                <table border="1" class="table table-bordered">
                    <thead id="table-head">
                        <tr>
                            <th scope="col">Upload Date/Time</th>
                            <th scope="col">Calories</th>
                            <th scope="col">Fat (in g)</th>
                            <th scope="col">Protein (in g)</th>
                            <th scope="col">Carbs (in g)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in meals %}
                            <tr>
                                <td> {{row["created_at"]}}</a></td>
                                <td>{{row["calories"]}}</td>
                                <td>{{row["fat"]}}</td>
                                <td>{{row["protein"]}}</td>
                                <td>{{row["carbs"]}}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </main>

        
    </body>
</html>
