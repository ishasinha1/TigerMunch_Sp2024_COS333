<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            TigerMunch Meal Information
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/display.css') }}">

    </head>
    <body>
        {% include 'header.html' %}
        <main>
            <div class="center-content-pg info-out">
                <h1 class="m-3">Meal Information</h1>
                <div class="fs-5">
                 <div class="container">
                    <form id="save_form">
                        <div class="field" tabindex="1">
                            <label for="cal">
                                <i class="far fa-user"></i>Calorie Estimate:
                            </label>
                            <input id="cal" name="cal" type="number" value="{{calorie_estimate}}"required>
                        </div>
                        <div class="field" tabindex="1">
                            <label for="fat">
                                <i class="far fa-user"></i>Fat Estimate:
                            </label>
                            <input id="fat" name="fat" type="number" value="{{fat_estimate}}"required>
                        </div>
                        <div class="field" tabindex="1">
                            <label for="protein">
                                <i class="far fa-user"></i>Protein Estimate:
                            </label>
                            <input id="protein" name="protein" type="number" value="{{protein_estimate}}"required>
                        </div>
                        <div class="field" tabindex="1">
                            <label for="carbs">
                                <i class="far fa-user"></i>Carbs Estimate:
                            </label>
                            <input id="carbs" name="carbs" type="number" value="{{carb_estimate}}"required>
                        </div>
                       
                        <div class="m-2">
                        <button type="submit" class="btn btn-success">Submit</button>
                        <a class="btn btn-success" href="{{ url_for('home') }}">Delete</a>
                        <a class="btn btn-success" href="{{ url_for('form') }}">Re-enter</a>
                        </div>
                </form>
                </div>
        </main>

<script>
console.log("Script loaded"); 
 $('#save_form').on("submit", function(event){
  event.preventDefault(); 

  let isValid = true; 
  if ($('#cal').val() < 0 ) {
    alert("Calorie goal should be nonnegative integer");
    isValid = false;
  }
  if ($('#fat').val() < 0) {
    alert("Fat goal should be nonnegative integer");
    isValid = false;
  }
  if ($('#protein').val() < 0) {
    alert("Protein goal should be nonnegative integer");
    isValid = false;
  }
  if ($('#carb').val() < 0) {
    alert("Carb goal should be  nonnegative integer");
    isValid = false;
  }

  if (isValid) {
    $.ajax({
        url: "/save_results",
    method: "POST",
    data: $(this).serialize(),
    success: function(data) {
        console.log(data); 
        if (data.status === 'success') {
            window.location.href = "/home";
        } else {
            console.error('Error from server', data);
            alert('Failed to save results.');
        }
    },
    error: function(xhr, status, error) {
        console.error("AJAX Error:", status, error);
        alert('An error occurred during the request.');
    }
});
  }
});

</script>
</body>
</html>
