<!DOCTYPE html>
<html>
    <head>
        <title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">

    <body>
        {% if username is none %}
             {% include 'header_loggedout.html' %}

                <h1>Meet The Team</h1>

                    <div class="profile m-2">
                        <img src="{{ url_for('static', filename='images/jeremiah.jpeg')}}" alt="Jeremiah Giordani">

                    </div>
                    <div class="profile m-2">
                        <img src="{{ url_for('static', filename='images/aylin.jpg')}}" alt="Aylin Hadzhieva">

                    </div>
                    <div class="profile m-2">
                        <img src="{{ url_for('static', filename='images/isha.jpeg')}}" alt="Isha Sinha">
