<!DOCTYPE html>
<html>
    <head>
        <title>
            TigerMunch
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/homestyle.css') }}">
    </head>
    <body>
        {% include 'header.html' %}
        <main>
            <div class="center-content-pg mt-5 pt-5">
                <h1>Today's Progress</h1>
                <div class="chart-display fs-5">
                    <div id="caloriesChartContainer" class="chart-elem m-2">
                        <div class="chart-container">
                            <canvas id="caloriesChart" class="canvas"></canvas>
                            <div id="caloriesChartPercentage" class="percentage"></div>
                        </div>
                        <div id="caloriesChartLabel" class="macro-count fs-6"></div>
                    </div>
                    <div id="fatChartContainer" class="chart-elem m-2">
                        <div class="chart-container">
                            <canvas id="fatChart" class="canvas"></canvas>
                            <div id="fatChartPercentage" class="percentage"></div>
                        </div>
                        <div id="fatChartLabel" class="macro-count fs-6"></div>
                    </div>
                    <div id="proteinChartContainer" class="chart-elem m-2">
                        <div class="chart-container">
                            <canvas id="proteinChart" class="canvas"></canvas>
                            <div id="proteinChartPercentage" class="percentage"></div>
                        </div>
                        <div id="proteinChartLabel" class="macro-count fs-6"></div>
                    </div>
                    <div id="carbChartContainer" class="chart-elem m-2">
                        <div class="chart-container">
                            <canvas id="carbChart" class="canvas"></canvas>
                            <div id="carbChartPercentage" class="percentage"></div>
                        </div>
                        <div id="carbChartLabel" class="macro-count fs-6"></div>
                    </div>
                </div>
                <div class="m-5">
                    <a class="btn btn-success btn-lg" href="{{ url_for('form') }}">Add new meal data</a>             
                </div>
                <!-- <h3 id="showFeaturesTxt" style="display: none;">You have no daily goals set up! Set up goals below!</h3> -->
                <div class="m-5">
                    <!-- <button class="btn btn-success btn-lg" id="showFeaturesBtn" style="display: none;">Add Goals Here</button> -->
                    <div class="container">
                        <!-- <ul>
                          <li> -->
                            <a class="animated-arrow">
                              <span class="the-arrow -left">
                                <span class="shaft"></span>
                              </span>
                              <span class="main">
                                <span class="text" id="showFeaturesBtn"> <h3>You have no daily goals set up! Set up goals here!></h3></span>
                                <span class="the-arrow -right">
                                  <span class="shaft"></span>
                                </span>
                              </span>
                            </a>
                          <!-- </li>
                        </ul> -->
                      </div>    
                </div>
            </div>
        </main>
        <script src="{{ url_for('static', filename='scripts/render_progress.js') }}"></script>      
        <script>
            $(document).ready(function(){
                $("#showFeaturesBtn").click(function(){
                    // Programmatically toggle the navbar dropdown
                    var dropdownMenu = new bootstrap.Dropdown(document.getElementById('navbarDropdownMenuLink'));
                    dropdownMenu.toggle();
            
                    // Show the modal
                    var exampleModal = new bootstrap.Modal(document.getElementById('exampleModal'), {
                        keyboard: false,
                        backdrop: 'static'
                    });
                    exampleModal.show();
                });
            });
        </script>
    </body>
</html>
