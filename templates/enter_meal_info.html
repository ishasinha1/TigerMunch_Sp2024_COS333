<!DOCTYPE html>
<html>
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>
        Enter Meal Information
      </title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="{{ url_for('static',filename='styles/formstyle.css') }}">
      <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">
    </head>
    <body>
      {% include 'header.html' %}
      <div id="loadingOverlay" style="display: none;">
        <div id="loadingText">Munch... Munch... Munch!!</div>
        <div id="loadingIcon"></div>
      </div>
      <div id="content">
        <main>
          <form method="post" action="{{ url_for('get_results') }}" enctype="multipart/form-data" class="p-3 center-content-pg" id="submitForm">
            <div class="flex-input">
              <div class="m-3 p-3 form-elem">
                <p class="fs-2">Photo Upload</p>
                <div>
                  <label for="photo" class="form-label upload-btn fs-4">Choose file</label>
                  <input type="file" name="photo" id="photo" class="form-control" hidden/>
                  <span id="file-chosen" class="fs-6">No file chosen</span>
                </div>
              </div>
              <div class="m-3 p-3 form-elem">
                <label for="description" class="form-label fs-2">Meal Description</label>
                <textarea name="description" id="description" class=""></textarea>
              </div>
            </div>
            <div class="button-flex">
              <button type="submit" class="btn btn-success btn-lg mt-3">
                Submit
              </button>
            </div>
          </form>
        </main>
      </div>

      <footer>
      </footer>
      <script src="{{ url_for('static', filename='scripts/file_upload.js')}}"></script>
      <script src= "https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
      <script>
        $(document).ready(function() {
          // let munchIndex = 1; // To keep track of the text change state
          // const munchTexts = [
          //     "Munch...",
          //     "Munch... Munch",
          //     "Munch... Munch... Munch!!"
          //   ];

          // function startMunching() {
          //   $('#loadingText').text("Changed");
          //   $('#loadingText').text(munchTexts[munchIndex % munchTexts.length]);
          //   munchIndex++;
          // }
          function styleChange(){
            $('#loadingOverlay').css('display', 'flex'); // Show the overlay
            $('#content').css('filter', 'blur(2px)'); // Blur the background content
          }

          $('#submitForm').on('submit', function() {
            styleChange();
            // window.setInterval(startMunching, 1000);
            // startMunching();
          });
        });
      </script>
    </body>
</html>
