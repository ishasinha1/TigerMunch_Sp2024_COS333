<!DOCTYPE html>
<html>
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>
        Enter Meal Information
      </title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="{{ url_for('static',filename='styles/formstyle.css') }}">
    </head>
    <body>
      <header>
      </header>
      <main>
        <form method="post" action="{{ url_for('get_results') }}" enctype="multipart/form-data" class="mx-auto p-2 position-absolute top-50 start-50 translate-middle">
          <div class="flex-input">
            <div class="m-3 p-3 form-elem fs-2">
              <label for="photo" class="form-label">Photo Upload</label><br />
              <input type="file" name="photo" id="photo" class="form-control-lg mx-auto"/>
            </div>
            <div class="m-3 p-3 form-elem fs-2">
              <label for="description" class="form-label">Meal Description</label><br />
              <textarea name="description" id="description" class="form-control-lg mx-auto"></textarea>
            </div>
          </div>
          <div class="button-flex">
            <button type="submit" class="btn btn-success btn-lg">
              Submit
            </button>
          </div>
        </form>
      </main>
      <footer>
      </footer>
    </body>
</html>
