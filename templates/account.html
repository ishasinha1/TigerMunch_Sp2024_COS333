<!DOCTYPE html>
<html>
    <head>
        <title>
            TigerMunch Account
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/homestyle.css') }}">
        <link rel="stylesheet" href="{{ url_for('static',filename='styles/univstyle.css') }}">
    </head>
    <body>
        {% include 'header.html' %}
        <main>
            <div class="m-5 p-5 center-welcome">
                <form action="/account" method="get">
                    <table>
                        <tr>
                            <td align="right">First Name:</td>
                            <td><input type="text" id="first_name" name="first_name" value="{{account_info_dict['first_name']}}"></td>
                        </tr>
                        <tr>
                            <td align="right">Last Name:</td>
                            <td><input type="text" id="last_name" name="last_name" value="{{account_info_dict['last_name']}}"></td>
                        </tr>
                        <tr>
                            <td align="right">Daily Calorie Goal:</td>
                            <td><input type="number" id="cal_goal" name="cal_goal" value="{% if account_info_dict['calorie_goal'] != -1 %}{{ account_info_dict['calorie_goal'] }}{% endif %}"></td>
                        </tr>
                        <tr>
                            <td align="right">Daily Fat Goal (g):</td>
                            <td><input type="number" id="fat_goal" name="fat_goal" value="{% if account_info_dict['fat_goal'] != -1 %}{{ account_info_dict['fat_goal'] }}{% endif %}"></td>
                        </tr>
                        <tr>
                            <td align="right">Daily Protein Goal (g):</td>
                            <td><input type="number" id="protein_goal" name="protein_goal" value="{% if account_info_dict['protein_goal'] != -1 %}{{ account_info_dict['protein_goal'] }}{% endif %}"></td>
                        </tr>
                        <tr>
                            <td align="right">Daily Carb Goal (g):</td>
                            <td><input type="number" id="carb_goal" name="carb_goal" value="{% if account_info_dict['carb_goal'] != -1 %}{{ account_info_dict['carb_goal'] }}{% endif %}"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><button type="submit" id="submit">Save</button></td>
                        </tr>
                    </table>   
                </form>
            </div>
        </main>

        
    </body>
</html>
